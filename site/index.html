<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Java Notes</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark.css">
  <link rel="stylesheet" href="css/markdown-render.css">
  <link rel="stylesheet" href="css/markdown-render-dark.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Add meta tag for Go Live compatibility -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; connect-src 'self' https: data: blob:;">
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Java Notes</div>
      <input id="search" placeholder="Search notes..." />
      <nav id="list"></nav>
    </aside>
    <main class="content">
      <div class="folder-nav-top">
        <div class="nav-container">
          <div class="nav-buttons">
            <button id="folderJava" class="folder-btn active" data-folder="java">
              <span>Java</span>
            </button>
            <button id="folderOops" class="folder-btn" data-folder="oops">
              <span>OOPs</span>
            </button>
          </div>
          <div class="nav-actions">
            <button id="menuToggle" class="menu-toggle" title="Toggle menu" aria-label="Toggle menu">
              <i class="fa-solid fa-bars"></i>
            </button>
            <button id="darkToggle" class="dark-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
              <i id="darkIcon" class="fa-regular fa-moon"></i>
            </button>
          </div>
        </div>
      </div>
      <article id="article" class="article">
        <div style="padding: 40px; text-align: center; color: #666;">
          <h2>🚀 Loading Java Notes...</h2>
          <p>Please wait while we load your content.</p>
          <div style="margin: 20px 0;">
            <div style="display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2b6f6f; border-radius: 50%; animation: spin 1s linear infinite;"></div>
          </div>
          <style>
            @keyframes spin {
              0% { transform: rotate(0deg); }
              100% { transform: rotate(360deg); }
            }
          </style>
        </div>
      </article>
      <div class="content-footer">
        <a id="prevLink" class="nav-foot" href="#" aria-label="Previous topic">&larr; Previous</a>
        <a id="nextLink" class="nav-foot" href="#" aria-label="Next topic">Next &rarr;</a>
      </div>
      <footer class="site-footer">Made with ♥ — Content rendered by Avdesh Jadon.</footer>
    </main>
  </div>

  <script src="js/java-structure.js"></script>
  <script src="js/oops-structure.js"></script>
  <script src="js/app-dynamic.js"></script>
</body>
</html>
